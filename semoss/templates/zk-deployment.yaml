{{- if .Values.zookeeper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" .Values.env .Values.zookeeper.name }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-%s" .Values.env .Values.zookeeper.name }}
    helm.sh/chart: {{ include "semoss.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.zookeeper.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ printf "%s-%s" .Values.env .Values.zookeeper.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-%s" .Values.env .Values.zookeeper.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ printf "%s-%s" .Values.env .Values.zookeeper.name }}
          image: "{{ .Values.zookeeper.image.repository }}:{{ .Values.zookeeper.image.tag }}"
          imagePullPolicy: {{ .Values.zookeeper.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.zookeeper.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.zookeeper.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: {{ .Values.zookeeper.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          # Create SEMOSS ZK node structure after ZooKeeper starts
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    sleep 10 &&
                    zkCli.sh -server localhost:{{ .Values.zookeeper.service.port }} create /semoss_root "" 2>/dev/null || true;
                    zkCli.sh -server localhost:{{ .Values.zookeeper.service.port }} create /semoss_root/container "" 2>/dev/null || true;
                    zkCli.sh -server localhost:{{ .Values.zookeeper.service.port }} create /semoss_root/app "" 2>/dev/null || true
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      {{- end }}
{{- end }}
