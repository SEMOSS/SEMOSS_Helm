apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" .Values.env .Values.semoss.name }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-%s" .Values.env .Values.semoss.name }}
    helm.sh/chart: {{ include "semoss.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.semoss.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ printf "%s-%s" .Values.env .Values.semoss.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-%s" .Values.env .Values.semoss.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.semoss.serviceAccount.name }}
      serviceAccountName: {{ .Values.semoss.serviceAccount.name }}
      {{- end }}
      {{- if .Values.semoss.podSecurityContext }}
      securityContext:
        runAsUser: {{ .Values.semoss.podSecurityContext.runAsUser }}
        fsGroup: {{ .Values.semoss.podSecurityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.semoss.image.repository }}:{{ .Values.semoss.image.tag }}"
          imagePullPolicy: {{ .Values.semoss.image.pullPolicy }}
          command:
            - /bin/bash
          args:
            - -c
            - runCS.sh
          securityContext:
            capabilities:
              drop:
                - NET_RAW
          {{- if .Values.semoss.resources }}
          resources:
            {{- toYaml .Values.semoss.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.semoss.readinessProbe.turnOn }}
          readinessProbe:
            httpGet:
              path: /Monolith/api/config
              port: 8080
              scheme: HTTP
            initialDelaySeconds: {{ .Values.semoss.readinessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.semoss.readinessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.semoss.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.semoss.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.semoss.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.semoss.livenessProbe.turnOn }}
          livenessProbe:
            httpGet:
              path: /Monolith/api/config
              port: 8080
              scheme: HTTP
            initialDelaySeconds: {{ .Values.semoss.livenessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.semoss.livenessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.semoss.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.semoss.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.semoss.livenessProbe.successThreshold }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.semoss.service.port }}
              protocol: TCP
          env:

            # --- Pod Identity ---
            - name: POD_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name

            # --- Security DB ---
            - name: CUSTOM_SECURITY_DRIVER
              value: {{ .Values.security.driver | quote }}
            - name: CUSTOM_SECURITY_RDBMS_TYPE
              value: {{ .Values.security.rdbmsType | quote }}
            - name: CUSTOM_SECURITY_USERNAME
              value: {{ .Values.security.username | quote }}
            - name: CUSTOM_SECURITY_PASSWORD
              value: {{ .Values.security.password | quote }}
            - name: CUSTOM_SECURITY_SCHEMA
              value: {{ .Values.security.schema | quote }}
            - name: CUSTOM_SECURITY_DATABASE
              value: {{ .Values.security.database | quote }}
            - name: CUSTOM_SECURITY_CONNECTION_URL
              value: {{ .Values.security.connectionUrl | quote }}

            # --- Local Master DB ---
            - name: CUSTOM_LM_DRIVER
              value: {{ .Values.localmaster.driver | quote }}
            - name: CUSTOM_LM_RDBMS_TYPE
              value: {{ .Values.localmaster.rdbmsType | quote }}
            - name: CUSTOM_LM_USERNAME
              value: {{ .Values.localmaster.username | quote }}
            - name: CUSTOM_LM_PASSWORD
              value: {{ .Values.localmaster.password | quote }}
            - name: CUSTOM_LM_SCHEMA
              value: {{ .Values.localmaster.schema | quote }}
            - name: CUSTOM_LM_DATABASE
              value: {{ .Values.localmaster.database | quote }}
            - name: CUSTOM_LM_CONNECTION_URL
              value: {{ .Values.localmaster.connectionUrl | quote }}

            # --- Scheduler DB ---
            - name: CUSTOM_SCHEDULER_DRIVER
              value: {{ .Values.scheduler.driver | quote }}
            - name: CUSTOM_SCHEDULER_RDBMS_TYPE
              value: {{ .Values.scheduler.rdbmsType | quote }}
            - name: CUSTOM_SCHEDULER_USERNAME
              value: {{ .Values.scheduler.username | quote }}
            - name: CUSTOM_SCHEDULER_PASSWORD
              value: {{ .Values.scheduler.password | quote }}
            - name: CUSTOM_SCHEDULER_SCHEMA
              value: {{ .Values.scheduler.schema | quote }}
            - name: CUSTOM_SCHEDULER_DATABASE
              value: {{ .Values.scheduler.database | quote }}
            - name: CUSTOM_SCHEDULER_CONNECTION_URL
              value: {{ .Values.scheduler.connectionUrl | quote }}

            # --- Themes DB ---
            - name: CUSTOM_THEMES_DRIVER
              value: {{ .Values.themes.driver | quote }}
            - name: CUSTOM_THEMES_RDBMS_TYPE
              value: {{ .Values.themes.rdbmsType | quote }}
            - name: CUSTOM_THEMES_USERNAME
              value: {{ .Values.themes.username | quote }}
            - name: CUSTOM_THEMES_PASSWORD
              value: {{ .Values.themes.password | quote }}
            - name: CUSTOM_THEMES_SCHEMA
              value: {{ .Values.themes.schema | quote }}
            - name: CUSTOM_THEMES_DATABASE
              value: {{ .Values.themes.database | quote }}
            - name: CUSTOM_THEMES_CONNECTION_URL
              value: {{ .Values.themes.connectionUrl | quote }}

            # --- User Tracking DB ---
            - name: CUSTOM_USER_TRACKING_DRIVER
              value: {{ .Values.usertracking.driver | quote }}
            - name: CUSTOM_USER_TRACKING_RDBMS_TYPE
              value: {{ .Values.usertracking.rdbmsType | quote }}
            - name: CUSTOM_USER_TRACKING_USERNAME
              value: {{ .Values.usertracking.username | quote }}
            - name: CUSTOM_USER_TRACKING_PASSWORD
              value: {{ .Values.usertracking.password | quote }}
            - name: CUSTOM_USER_TRACKING_SCHEMA
              value: {{ .Values.usertracking.schema | quote }}
            - name: CUSTOM_USER_TRACKING_DATABASE
              value: {{ .Values.usertracking.database | quote }}
            - name: CUSTOM_USER_TRACKING_CONNECTION_URL
              value: {{ .Values.usertracking.connectionUrl | quote }}
            - name: USER_TRACKING_ENABLED
              value: {{ .Values.usertracking.enabled | quote }}

            # --- Model Inference Logs DB ---
            {{- if .Values.modelInferenceLogs.enabled }}
            - name: MODEL_INFERENCE_LOGS_ENABLED
              value: "true"
            - name: CUSTOM_MODEL_INFERENCE_LOGS_DRIVER
              value: {{ .Values.modelInferenceLogs.driver | quote }}
            - name: CUSTOM_MODEL_INFERENCE_LOGS_RDBMS_TYPE
              value: {{ .Values.modelInferenceLogs.rdbmsType | quote }}
            - name: CUSTOM_MODEL_INFERENCE_LOGS_USERNAME
              value: {{ .Values.modelInferenceLogs.username | quote }}
            - name: CUSTOM_MODEL_INFERENCE_LOGS_PASSWORD
              value: {{ .Values.modelInferenceLogs.password | quote }}
            - name: CUSTOM_MODEL_INFERENCE_LOGS_SCHEMA
              value: {{ .Values.modelInferenceLogs.schema | quote }}
            - name: CUSTOM_MODEL_INFERENCE_LOGS_DATABASE
              value: {{ .Values.modelInferenceLogs.database | quote }}
            - name: CUSTOM_MODEL_INFERENCE_LOGS_CONNECTION_URL
              value: {{ .Values.modelInferenceLogs.connectionUrl | quote }}
            {{- end }}

            # --- Prompt Hub DB ---
            {{- if .Values.promptHub.enabled }}
            - name: PROMPT_DB_ENABLED
              value: "true"
            - name: CUSTOM_PROMPT_DRIVER
              value: {{ .Values.promptHub.driver | quote }}
            - name: CUSTOM_PROMPT_RDBMS_TYPE
              value: {{ .Values.promptHub.rdbmsType | quote }}
            - name: CUSTOM_PROMPT_USERNAME
              value: {{ .Values.promptHub.username | quote }}
            - name: CUSTOM_PROMPT_PASSWORD
              value: {{ .Values.promptHub.password | quote }}
            - name: CUSTOM_PROMPTS_SCHEMA
              value: {{ .Values.promptHub.schema | quote }}
            - name: CUSTOM_PROMPT_DATABASE
              value: {{ .Values.promptHub.database | quote }}
            - name: CUSTOM_PROMPT_CONNECTION_URL
              value: {{ .Values.promptHub.connectionUrl | quote }}
            {{- end }}

            # --- Audit Logs DB ---
            {{- if .Values.auditLogs.enabled }}
            - name: AUDIT_LOGS_DATABASE_ENABLED
              value: "true"
            - name: CUSTOM_AUDITLOGS_DRIVER
              value: {{ .Values.auditLogs.driver | quote }}
            - name: CUSTOM_AUDITLOGS_RDBMS_TYPE
              value: {{ .Values.auditLogs.rdbmsType | quote }}
            - name: CUSTOM_AUDITLOGS_USERNAME
              value: {{ .Values.auditLogs.username | quote }}
            - name: CUSTOM_AUDITLOGS_PASSWORD
              value: {{ .Values.auditLogs.password | quote }}
            - name: CUSTOM_AUDITLOGS_SCHEMA
              value: {{ .Values.auditLogs.schema | quote }}
            - name: CUSTOM_AUDITLOGS_DATABASE
              value: {{ .Values.auditLogs.database | quote }}
            - name: CUSTOM_AUDITLOGS_CONNECTION_URL
              value: {{ .Values.auditLogs.connectionUrl | quote }}
            {{- end }}

            # --- Auth & Security ---
            - name: SECURITY_ON
              value: {{ .Values.semoss.security.securityOn | quote }}
            {{- if .Values.semoss.security.anonymousUserOn }}
            - name: ANONYMOUS_USERS
              value: {{ .Values.semoss.security.anonymousUserOn | quote }}
            {{- end }}
            {{- if .Values.semoss.security.anonymousUserUploadOn }}
            - name: ANONYMOUS_USER_UPLOAD
              value: {{ .Values.semoss.security.anonymousUserUploadOn | quote }}
            {{- end }}

            # --- Social / SSO ---
            {{- if .Values.semoss.social.setSocial }}
            - name: SETSOCIAL
              value: {{ .Values.semoss.social.setSocial | quote }}
            {{- end }}
            {{- if .Values.semoss.social.redirectUrl }}
            - name: REDIRECT
              value: {{ .Values.semoss.social.redirectUrl | quote }}
            {{- end }}
            {{- if .Values.semoss.social.enable_native_login }}
            - name: ENABLE_NATIVE
              value: {{ .Values.semoss.social.enable_native_login | quote }}
            {{- end }}
            {{- if .Values.semoss.social.enable_native_registration }}
            - name: ENABLE_NATIVE_REGISTRATION
              value: {{ .Values.semoss.social.enable_native_registration | quote }}
            {{- end }}
            {{- if .Values.semoss.social.enable_native_access_key_allowed }}
            - name: ENABLE_NATIVE_ACCESS_KEY_ALLOWED
              value: {{ .Values.semoss.social.enable_native_access_key_allowed | quote }}
            {{- end }}
            {{- if .Values.semoss.social.enable_api_user }}
            - name: ENABLE_API_USER
              value: {{ .Values.semoss.social.enable_api_user | quote }}
            {{- end }}
            {{- if .Values.semoss.social.api_user_dynamic }}
            - name: API_USER_DYNAMIC
              value: {{ .Values.semoss.social.api_user_dynamic | quote }}
            {{- end }}
            # Google SSO
            {{- if .Values.semoss.social.enable_google_login }}
            - name: ENABLE_GOOGLE
              value: {{ .Values.semoss.social.enable_google_login | quote }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.semoss.social.google_client_id | quote }}
            - name: GOOGLE_SECRET_KEY
              value: {{ .Values.semoss.social.google_secret_key | quote }}
            - name: GOOGLE_REDIRECT
              value: {{ .Values.semoss.social.google_redirect_uri | quote }}
            {{- end }}
            # GitHub SSO
            {{- if .Values.semoss.social.enable_github_login }}
            - name: ENABLE_GITHUB
              value: {{ .Values.semoss.social.enable_github_login | quote }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.semoss.social.github_client_id | quote }}
            - name: GITHUB_SECRET_KEY
              value: {{ .Values.semoss.social.github_secret_key | quote }}
            - name: GITHUB_REDIRECT
              value: {{ .Values.semoss.social.github_redirect_uri | quote }}
            {{- end }}
            # Microsoft SSO
            {{- if .Values.semoss.social.enable_ms_login }}
            - name: ENABLE_MS
              value: {{ .Values.semoss.social.enable_ms_login | quote }}
            - name: MS_AUTHORITY
              value: {{ .Values.semoss.social.ms_authority | quote }}
            - name: MS_TENANT
              value: {{ .Values.semoss.social.ms_tenant | quote }}
            - name: MS_CLIENT_ID
              value: {{ .Values.semoss.social.ms_client_id | quote }}
            - name: MS_SECRET_KEY
              value: {{ .Values.semoss.social.ms_secret_key | quote }}
            - name: MS_REDIRECT
              value: {{ .Values.semoss.social.ms_redirect_uri | quote }}
            - name: MS_ACCESS_KEY_ALLOWED
              value: {{ .Values.semoss.social.ms_access_key_allowed | quote }}
            - name: MS_GRAPHAPI_LOOKUP
              value: {{ .Values.semoss.social.ms_graphapi_lookup | quote }}
            {{- if .Values.semoss.social.ms_display_name }}
            - name: MS_DISPLAY_NAME
              value: {{ .Values.semoss.social.ms_display_name | quote }}
            {{- end }}
            {{- end }}

            # --- App Routing ---
            {{- if .Values.semoss.monolithCookie }}
            - name: MONOLITH_COOKIE
              value: {{ .Values.semoss.monolithCookie | quote }}
            {{- end }}
            {{- if .Values.semoss.routing.monolith_route }}
            - name: MONOLITH_ROUTE
              value: {{ .Values.semoss.routing.monolith_route | quote }}
            {{- end }}
            {{- if .Values.semoss.routing.fe_route }}
            - name: FE_ROUTE
              value: {{ .Values.semoss.routing.fe_route | quote }}
            {{- end }}
            - name: SCHEDULER_ENDPOINT
              value: {{ .Values.semoss.routing.scheduler_endpoint | quote }}
            {{- if .Values.semoss.googleAnalytics }}
            - name: GOOGLE_ANALYTICS_ID
              value: {{ .Values.semoss.googleAnalytics | quote }}
            {{- end }}

            # --- Python Settings ---
            - name: SMSS_PYTHONHOME
              value: {{ .Values.semoss.python.smss_pythonhome | quote }}
            - name: NETTY_PYTHON
              value: {{ .Values.semoss.python.netty_python | quote }}
            - name: NATIVE_PY_SERVER
              value: {{ .Values.semoss.python.native_py_server | quote }}
            - name: USE_TCP_PY
              value: {{ .Values.semoss.python.use_tcp_py | quote }}
            - name: USE_PY_FILE
              value: {{ .Values.semoss.python.use_py_file | quote }}
            - name: USE_FILE_PY
              value: {{ .Values.semoss.python.use_file_py | quote }}
            - name: TCP_WORKER
              value: {{ .Values.semoss.python.tcp_worker | quote }}
            - name: TCP_CLIENT
              value: {{ .Values.semoss.python.tcp_client | quote }}

            # --- R Settings ---
            - name: R_ON
              value: {{ .Values.semoss.r.r_on | quote }}
            - name: R_CONNECTION_TYPE
              value: {{ .Values.semoss.r.r_connection_type | quote }}
            - name: R_HOME
              value: {{ .Values.semoss.r.r_home | quote }}
            - name: NETTY_R
              value: {{ .Values.semoss.r.netty_r | quote }}
            {{- if .Values.semoss.r.r_pool_size }}
            - name: RSERVE_CONNECTION_POOL_SIZE
              value: {{ .Values.semoss.r.r_pool_size | quote }}
            {{- end }}
            {{- if .Values.semoss.r.r_user_recovery }}
            - name: R_USER_RECOVERY
              value: {{ .Values.semoss.r.r_user_recovery | quote }}
            {{- end }}

            # --- File Transfer ---
            - name: FILE_UPLOAD_LIMIT
              value: {{ .Values.semoss.environmentVariables.FILE_UPLOAD_LIMIT | quote }}
            - name: FILE_TRANSFER_LIMIT
              value: {{ .Values.semoss.environmentVariables.FILE_TRANSFER_LIMIT | quote }}

            # --- Cluster & Storage ---
            - name: SEMOSS_IS_CLUSTER
              value: {{ .Values.semoss.environmentVariables.SEMOSS_IS_CLUSTER | quote }}
            - name: SESSION_TIMEOUT
              value: {{ .Values.semoss.environmentVariables.SESSION_TIMEOUT | quote }}
            - name: OPTIONAL_COOKIES
              value: {{ .Values.semoss.environmentVariables.OPTIONAL_COOKIES | quote }}
            - name: DISABLE_GIT_TERMINAL
              value: {{ .Values.semoss.environmentVariables.DISABLE_GIT_TERMINAL | quote }}
            {{- if .Values.semoss.environmentVariables.SEMOSS_STORAGE_PROVIDER }}
            - name: SEMOSS_STORAGE_PROVIDER
              value: {{ .Values.semoss.environmentVariables.SEMOSS_STORAGE_PROVIDER | quote }}
            {{- end }}
            # Azure storage
            {{- if .Values.semoss.environmentVariables.AZCONN }}
            - name: AZCONN
              value: {{ .Values.semoss.environmentVariables.AZCONN | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.AZ_NAME }}
            - name: AZ_NAME
              value: {{ .Values.semoss.environmentVariables.AZ_NAME | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.AZ_KEY }}
            - name: AZ_KEY
              value: {{ .Values.semoss.environmentVariables.AZ_KEY | quote }}
            {{- end }}
            # S3 storage
            {{- if .Values.semoss.environmentVariables.S3_REGION }}
            - name: S3_REGION
              value: {{ .Values.semoss.environmentVariables.S3_REGION | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.S3_BUCKET }}
            - name: S3_BUCKET
              value: {{ .Values.semoss.environmentVariables.S3_BUCKET | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.S3_ACCESS_KEY }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.semoss.environmentVariables.S3_ACCESS_KEY | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.S3_SECRET_KEY }}
            - name: S3_SECRET_KEY
              value: {{ .Values.semoss.environmentVariables.S3_SECRET_KEY | quote }}
            {{- end }}
            # Terminal controls
            {{- if .Values.semoss.environmentVariables.DISABLE_TERMINAL }}
            - name: DISABLE_TERMINAL
              value: {{ .Values.semoss.environmentVariables.DISABLE_TERMINAL | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.DISABLE_PY_TERMINAL }}
            - name: DISABLE_PY_TERMINAL
              value: {{ .Values.semoss.environmentVariables.DISABLE_PY_TERMINAL | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.DISABLE_R_TERMINAL }}
            - name: DISABLE_R_TERMINAL
              value: {{ .Values.semoss.environmentVariables.DISABLE_R_TERMINAL | quote }}
            {{- end }}
            # Misc
            {{- if .Values.semoss.environmentVariables.T_ON }}
            - name: T_ON
              value: {{ .Values.semoss.environmentVariables.T_ON | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.ERROR_REPORT_VALVE_ENABLED }}
            - name: ERROR_REPORT_VALVE_ENABLED
              value: {{ .Values.semoss.environmentVariables.ERROR_REPORT_VALVE_ENABLED | quote }}
            {{- end }}
            {{- if .Values.semoss.environmentVariables.AUDIT_LOGS_DATABASE_ENABLED }}
            - name: AUDIT_LOGS_DATABASE_ENABLED
              value: {{ .Values.semoss.environmentVariables.AUDIT_LOGS_DATABASE_ENABLED | quote }}
            {{- end }}

            # --- Zookeeper ---
            {{- if .Values.zookeeper.enabled }}
            - name: SEMOSS_IS_CLUSTER_ZK
              value: "true"
            - name: ZK_SERVER
              value: "{{ printf "%s-%s" .Values.env .Values.zookeeper.name }}:{{ .Values.zookeeper.service.port }}"
            {{- else if .Values.semoss.environmentVariables.ZK_SERVER }}
            - name: SEMOSS_IS_CLUSTER_ZK
              value: "true"
            - name: ZK_SERVER
              value: {{ .Values.semoss.environmentVariables.ZK_SERVER | quote }}
            {{- end }}

      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      {{- end }}
