promptHub:
  enabled: false
  connectionUrl: ""
  driver: "org.postgresql.Driver"
  rdbmsType: "POSTGRES"
  username: ""
  password: ""
  schema: "public"
  database: "prompt_hub"

auditLogs:
  enabled: false
  connectionUrl: ""
  driver: "org.postgresql.Driver"
  rdbmsType: "POSTGRES"
  username: ""
  password: ""
  schema: "public"
  database: "audit_logs"


nodeSelector: {}
tolerations: []
affinity: {}
