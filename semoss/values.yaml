# Default values for semoss.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

env: "semoss"

# Docker pull secret name (e.g. "regcred")
imagePullSecrets: ""

semoss:
  replicaCount: 1
  name: semoss
  image:
    # Override with your image: e.g. quay.io/semoss/semoss-dev:5.2.0-SNAPSHOT-ubuntu22-latest
    repository: semoss/docker
    tag: "latest"
    pullPolicy: Always

  readinessProbe:
    turnOn: true
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 2
  livenessProbe:
    turnOn: true
    initialDelaySeconds: 60
    timeoutSeconds: 300
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  nameOverride: ""
  fullnameOverride: ""

  # Kubernetes service account (needed for cloud IAM roles, e.g. AWS IRSA for S3 access)
  serviceAccount:
    name: ""

  # Pod-level security context
  podSecurityContext:
    runAsUser: 1001
    fsGroup: 0

  # Resource requests and limits
  resources:
    limits:
      cpu: "8"
      memory: "30Gi"
    requests:
      cpu: "2"
      memory: "8Gi"

  monolithCookie: "monolith"
  googleAnalytics: ""

  security:
    securityOn: true
    anonymousUserOn: false
    anonymousUserUploadOn: false

  social:
    setSocial: "true"
    redirectUrl: "http://my.example.org/SemossWeb/"
    # Native login
    enable_native_login: "true"
    enable_native_registration: "true"
    enable_native_access_key_allowed: "true"
    # API user
    enable_api_user: "true"
    api_user_dynamic: "false"
    # Google SSO
    enable_google_login: ""
    google_client_id: ""
    google_secret_key: ""
    google_redirect_uri: ""
    google_scope: "https://www.googleapis.com/auth/forms https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/cloud-language"
    google_access_type: "online"
    google_maps_api: ""
    # GitHub SSO
    enable_github_login: ""
    github_client_id: ""
    github_secret_key: ""
    github_redirect_uri: ""
    github_scope: "public_repo"
    # Microsoft SSO
    enable_ms_login: ""
    ms_authority: ""
    ms_tenant: ""
    ms_client_id: ""
    ms_secret_key: ""
    ms_redirect_uri: ""
    ms_scope: "User.Read"
    ms_access_key_allowed: "true"
    ms_graphapi_lookup: "false"
    ms_display_name: ""

  # App routing - used for multi-instance deployments sharing a single ingress
  routing:
    # MONOLITH_ROUTE: route suffix for this instance (e.g. "dev" → /dev/Monolith)
    monolith_route: ""
    # FE_ROUTE: frontend path prefix (e.g. "/dev/Monolith")
    fe_route: ""
    # Internal scheduler endpoint (usually localhost since scheduler runs in same pod)
    scheduler_endpoint: "http://localhost:8080/Monolith"

  # Python runtime settings
  python:
    smss_pythonhome: "/usr/lib/python/semossvenv"
    netty_python: "true"
    native_py_server: "true"
    use_tcp_py: "false"
    use_py_file: "false"
    use_file_py: "false"
    tcp_worker: "prerna.tcp.SocketServer"
    tcp_client: "prerna.tcp.client.NativePySocketClient"

  r:
    r_on: "false"
    r_connection_type: "JRI"
    r_home: "/tmp"
    netty_r: "true"
    r_pool_size: ""
    r_user_recovery: ""

  service:
    type: ClusterIP
    port: 8080
    nodePort: ""

  environmentVariables:
    # Azure Blob Storage
    AZURE_ACCT_KEY: ""
    AZURE_ACCT_NAME: ""
    AZCONN: ""
    # AWS S3
    S3_REGION: ""
    S3_BUCKET: ""
    S3_ACCESS_KEY: ""
    S3_SECRET_KEY: ""
    # Cluster mode
    SEMOSS_IS_CLUSTER: "true"
    SEMOSS_STORAGE_PROVIDER: ""   # AZURE | S3 | GCS | MINIO | LOCAL
    DISABLE_GIT_TERMINAL: "true"
    # Session
    SESSION_TIMEOUT: "28800"      # seconds (28800 = 8 hours)
    OPTIONAL_COOKIES: "false"
    # File limits (MB)
    FILE_UPLOAD_LIMIT: "500"
    FILE_TRANSFER_LIMIT: "500"
    # Tomcat manager disable (set to "false" to disable the /manager app)
    T_ON: ""
    # Error reporting valve
    ERROR_REPORT_VALVE_ENABLED: ""
    # Audit log database enabled flag (standalone, without full auditLogs.enabled block)
    AUDIT_LOGS_DATABASE_ENABLED: ""
    # External Zookeeper (leave blank to auto-compute from zookeeper.enabled)
    ZK_SERVER: ""


ingress:
  name: "ingress"
  enabled: true
  # Configured for nginx ingress with sticky sessions - adjust annotations for other controllers
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: route-semoss
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/app-root: /SemossWeb
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
  tls: []
  #    - hosts:
  #        - "my.example.org"
  #      secretName: my-tls-secret
  hosts:
    - host: my.example.org
      paths:
        - /


# --- Zookeeper (required for cluster mode with SEMOSS_IS_CLUSTER_ZK=true) ---
zookeeper:
  enabled: false
  replicaCount: 1
  name: zk
  image:
    repository: zookeeper
    tag: "3.8.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 2181


# --- System Databases ---
# Each database supports two connection modes:
#   h2 mode (default): deploys a local H2 TCP server pod and uses REMOTE_* env vars
#   postgres mode: set customDb.connectionUrl to use CUSTOM_* env vars (no H2 pod needed)

security:
  replicaCount: 1
  name: security
  image:
    repository: semoss/h2
    tag: 1.4.200
    pullPolicy: IfNotPresent
  nameOverride: ""
  fullnameOverride: ""
  useStorage: true
  # storageClass: ""
  storageSize: 3Gi
  service:
    type: ClusterIP
    port: 1521
  volume:
    name: sec
    persistentVolumeClaimName: security-volume
    persistentVolumeReclaimPolicy: Retain
  # Set connectionUrl to switch from H2 pod to external PostgreSQL
  customDb:
    connectionUrl: ""   # e.g. jdbc:postgresql://dbhost:5432/security?currentSchema=public
    driver: "org.postgresql.Driver"
    rdbmsType: "POSTGRES"
    username: ""
    password: ""
    schema: "public"
    database: "security"

