# ============================================================
# Optional Feature Databases (disabled by default)
# Enable and provide connectionUrl to activate.
# ============================================================

modelInferenceLogs:
  enabled: false
  connectionUrl: ""
  driver: "org.postgresql.Driver"
  rdbmsType: "POSTGRES"
  username: ""
  password: ""
  schema: "public"
