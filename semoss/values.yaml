# Default values for semoss.
# This is a YAML-formatted file.

env: "semoss"

# Docker pull secret name for quay.io (e.g. "quay-pull-secret")
imagePullSecrets: ""


# ============================================================
# SEMOSS Application
# ============================================================
semoss:
  replicaCount: 1
  name: semoss
  image:
    repository: quay.io/semoss/semoss
    tag: "5.1.0-ubuntu22"
    pullPolicy: Always

  readinessProbe:
    turnOn: true
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 2
  livenessProbe:
    turnOn: true
    initialDelaySeconds: 60
    timeoutSeconds: 300
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  nameOverride: ""
  fullnameOverride: ""

  # Kubernetes service account (e.g. for AWS IRSA or Azure Workload Identity)
  serviceAccount:
    name: ""

  # Pod-level security context
  podSecurityContext:
    runAsUser: 1001
    fsGroup: 0

  resources:
    limits:
      cpu: "8"
      memory: "30Gi"
    requests:
      cpu: "2"
      memory: "8Gi"

  monolithCookie: "monolith"
  googleAnalytics: ""

  security:
    securityOn: true
    anonymousUserOn: false
    anonymousUserUploadOn: false

  social:
    setSocial: "true"
    redirectUrl: "http://my.example.org/SemossWeb/"
    # Native login
    enable_native_login: "true"
    enable_native_registration: "true"
    enable_native_access_key_allowed: "true"
    # API user
    enable_api_user: "true"
    api_user_dynamic: "false"
    # Google SSO
    enable_google_login: ""
    google_client_id: ""
    google_secret_key: ""
    google_redirect_uri: ""
    # GitHub SSO
    enable_github_login: ""
    github_client_id: ""
    github_secret_key: ""
    github_redirect_uri: ""
    # Microsoft SSO
    enable_ms_login: ""
    ms_authority: ""        # e.g. https://login.microsoftonline.com/<tenant>/
    ms_tenant: ""
    ms_client_id: ""
    ms_secret_key: ""
    ms_redirect_uri: ""
    ms_scope: "User.Read"
    ms_access_key_allowed: "true"
    ms_graphapi_lookup: "false"
    ms_display_name: ""

  # Multi-instance routing (for deployments sharing a single ingress)
  routing:
    monolith_route: ""      # MONOLITH_ROUTE — route suffix, e.g. "dev" → /dev/Monolith
    fe_route: ""            # FE_ROUTE — frontend path, e.g. "/dev/Monolith"
    scheduler_endpoint: "http://localhost:8080/Monolith"

  # Python runtime
  python:
    smss_pythonhome: "/usr/lib/python/semossvenv"
    netty_python: "true"
    native_py_server: "true"
    use_tcp_py: "false"
    use_py_file: "false"
    use_file_py: "false"
    tcp_worker: "prerna.tcp.SocketServer"
    tcp_client: "prerna.tcp.client.NativePySocketClient"

  r:
    r_on: "false"
    r_connection_type: "JRI"
    r_home: "/tmp"
    netty_r: "true"
    r_pool_size: ""
    r_user_recovery: ""

  service:
    type: ClusterIP
    port: 8080
    nodePort: ""

  environmentVariables:
    # Storage provider: AZURE | S3 | GCS | MINIO | LOCAL
    SEMOSS_STORAGE_PROVIDER: ""
    SEMOSS_IS_CLUSTER: "true"
    # Azure Blob Storage
    AZCONN: ""          # full connection string (triggers setAzureProps.sh)
    AZ_NAME: ""         # storage account name
    AZ_KEY: ""          # storage account key
    # AWS S3
    S3_REGION: ""
    S3_BUCKET: ""
    S3_ACCESS_KEY: ""   # leave blank when using IRSA/instance role
    S3_SECRET_KEY: ""
    # Session
    SESSION_TIMEOUT: "28800"    # seconds
    OPTIONAL_COOKIES: "false"
    # File limits (MB)
    FILE_UPLOAD_LIMIT: "500"
    FILE_TRANSFER_LIMIT: "500"
    # Terminal access control
    DISABLE_GIT_TERMINAL: "true"
    DISABLE_TERMINAL: ""        # set "true" to disable the code terminal
    DISABLE_PY_TERMINAL: ""
    DISABLE_R_TERMINAL: ""
    # Misc
    T_ON: ""                          # set "false" to disable Tomcat manager app
    ERROR_REPORT_VALVE_ENABLED: ""
    AUDIT_LOGS_DATABASE_ENABLED: ""   # use auditLogs.enabled instead for full DB config
    # External Zookeeper override (auto-computed when zookeeper.enabled: true)
    ZK_SERVER: ""


# ============================================================
# Ingress (nginx with sticky sessions)
# ============================================================
ingress:
  name: "ingress"
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: route-semoss
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/app-root: /SemossWeb
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
  tls: []
  hosts:
    - host: my.example.org
      paths:
        - /


# ============================================================
# Zookeeper (required for cluster mode / horizontal scaling)
# ============================================================
zookeeper:
  enabled: false
  replicaCount: 1
  name: zk
  image:
    repository: zookeeper
    tag: "3.8.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 2181


# ============================================================
